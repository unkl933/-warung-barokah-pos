name: Build and Release Flutter APK

on:
  push:
    tags:
      - 'v*' # Trigger saat tag dibuat, contoh: v1.0.2

permissions:
  contents: write # Memberikan izin tulis untuk membuat Release & upload APK

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          # Mengambil nama tag (misal: v1.0.2) dan menghapus huruf 'v' di depannya
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NAME="${TAG_NAME#v}"
          
          echo "Building version: $VERSION_NAME with build number: ${{ github.run_number }}"
          
          # Build APK dengan versi dinamis tanpa mengubah pubspec.yaml
          flutter build apk --release --build-name=$VERSION_NAME --build-number=${{ github.run_number }}

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
